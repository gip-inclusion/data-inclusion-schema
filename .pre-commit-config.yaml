# Tools that are project dependencies (e.g. ruff) run as local hooks via `uv run`,
# so their version comes from `uv.lock`. Upgrade them with `uv lock --upgrade-package`.
# Other tools use remote hooks, upgraded with `pre-commit autoupdate`.
repos:
- repo: local
  hooks:
    - id: pytest
      name: pytest
      language: system
      entry: uv run pytest
      always_run: true
      pass_filenames: false
      fail_fast: true
- repo: local
  hooks:
    - id: ruff
      name: ruff
      language: system
      entry: uv run ruff check --fix
      types_or: [python, pyi]
    - id: ruff-format
      name: ruff-format
      language: system
      entry: uv run ruff format
      types_or: [python, pyi]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.7
  hooks:
    - id: uv-lock
- repo: local
  hooks:
    - id: compile-schema
      name: compile-schema
      language: system
      entry: uv run ./scripts/compile_schema.py
      always_run: true
      pass_filenames: false
    - id: check-apostrophe
      name: check-apostrophe
      language: system
      entry: bash -c "! grep -rn \"'\" schemas/ || exit 1"
      always_run: true
      pass_filenames: false
- repo: local
  hooks:
    - id: compile-docs
      name: compile-docs
      language: system
      entry: uv run --group docs ./scripts/compile_docs.py
      always_run: true
      pass_filenames: false
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-json
    - id: trailing-whitespace
    - id: end-of-file-fixer
      exclude: '^schemas/.*'
    - id: detect-private-key
